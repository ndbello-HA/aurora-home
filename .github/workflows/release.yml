name: Publicar pacote para a TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar AuroraHome.wgt
        run: |
          VERSION=$(grep -o 'version="[0-9.]*"' config.xml | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          zip -r -X AuroraHome.wgt config.xml index.html icon.png css js
          unzip -l AuroraHome.wgt
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" AuroraHome.wgt \
            --title "Aurora Home ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Pacote gerado automaticamente a partir do commit ${GITHUB_SHA::7}." \
            --latest
